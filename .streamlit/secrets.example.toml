# Streamlit Cloud 部署时的密钥配置示例。
# 部署时把本文件内容粘贴到 Streamlit Cloud 控制台的
# App settings → Secrets 编辑框中（不要提交真实的 secrets.toml 到仓库）。
#
# 注意：真实的 .streamlit/secrets.toml 已在 .gitignore 中忽略。

DEEPSEEK_API_KEY = "sk-你的DeepSeek密钥"
DASHSCOPE_API_KEY = "sk-你的通义百炼密钥（仅 EMBEDDING_PROVIDER=dashscope 时需要）"

# 可选：覆盖默认模型/参数（不填则使用代码内默认值）
# DEEPSEEK_MODEL = "deepseek-chat"
# EMBEDDING_PROVIDER = "dashscope"
# EMBEDDING_MODEL = "text-embedding-v3"
# TOP_K = "4"
